<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design.css">
    <script src="scripts/values.js" defer></script>
    <script src="scripts/DirectMapping.js" defer></script>
    <script src="scripts/AsssociativeMapping.js" defer></script>
    <script src="scripts/SetAssociativeMapping.js" defer></script>
    <script src="scripts/main.js" defer></script>
    <title>Cache Memory Simulator</title>
</head>
<body>
    <div id="frame">
        <div id="inputField">
            <h4>Cache Memory Simulator</h4>
            <label>Cache Size: </label><br>
            <input type="number" id="cacheSize" name="cacheSize" min="1"><br>

            <label>Block Size: </label><br>
            <input type="number" name="blockSize" id="blockSize" min="1"><br>

            <label>Mapping Technique:</label><br>
            <select name="mappingTechnique" id="dropdown">
                <option value=""></option>
                <option value="Direct Mapping">Direct Mapping</option>
                <option value="Associative Mapping">Associative Mapping</option>
                <option value="Set-Associative Mapping">Set-Associative Mapping</option>
            </select>
            <br>

            <div id="setBox" style="display: none;">
                <label>Set: </label><br>
                <input type="number" name="set" id="setInput"><br>
            </div>
            
            <label>Memory address sequence: </label><br>
            <input type="text" name="memoryAddress" id="memoryAddress"><br>
            <button id="simulate" onclick="runSimulation()">Simulate</button>
        </div>
        
        <div id="output">
            <h3>Memory Address Result</h3>
            <div id="tableContainer">
                <thead>
                    <tr>
                        <th>Address</th>
                        <th>Status</th>
                    </tr>
                    
                </thead>
                 <tbody id="memoryAddressResult">

                 </tbody>
            </div>
           
        <div id="result">
            <div>Cache Hits:
                <p id="cacheHits"></p>
            </div>

            <div>Cache Miss:
                <p id="cacheMisses"></p>
            </div>

            <div>Hit Rate:
                <p id="hitRate"></p>    
            </div>

            <div>Miss Rate: 
                <p id="missRate"></p>
            </div>
        </div>

        </div>
    </div>
    
</body>
</html>
